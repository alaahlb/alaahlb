<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 252 36" width="252" height="36" role="img" aria-label="Based in the United Arab Emirates — connect on LinkedIn">
  <!--
    UAE flag as the button ground. The left 72x36 is a true 2:1 flag with the
    red hoist at exactly 1/4 width; the three bands then run the full length as
    background. A horizontal scrim stays light over the flag and deepens under
    the label so white text clears AA on the white band.
  -->
  <defs>
    <clipPath id="r"><rect x="0" y="0" width="252" height="36" rx="9"/></clipPath>
    <linearGradient id="scrim" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="252" y2="0">
      <stop offset="0"     stop-color="#000000" stop-opacity="0.06"/>
      <stop offset="0.262" stop-color="#000000" stop-opacity="0.10"/>
      <stop offset="0.341" stop-color="#000000" stop-opacity="0.60"/>
      <stop offset="1"     stop-color="#000000" stop-opacity="0.64"/>
    </linearGradient>
  </defs>
  <g clip-path="url(#r)">
    <rect x="18" y="0"  width="234" height="12" fill="#00732F"/>
    <rect x="18" y="12" width="234" height="12" fill="#FFFFFF"/>
    <rect x="18" y="24" width="234" height="12" fill="#000000"/>
    <rect x="0"  y="0"  width="18"  height="36" fill="#FF0000"/>
    <rect x="0"  y="0"  width="252" height="36" fill="url(#scrim)"/>
  </g>
  <rect x="0.5" y="0.5" width="251" height="35" rx="8.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.28"/>
  <text x="88" y="23.2" font-family="'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="600" letter-spacing="0.1" textLength="146.8" lengthAdjust="spacingAndGlyphs" fill="#FFFFFF">United Arab Emirates</text>
</svg>
